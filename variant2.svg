
<svg version="1.1"
     baseProfile="full"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:ev="http://www.w3.org/2001/xml-events"
     width="700"
     height="600"
     viewBox="0 0 700 600">

    <title>Лабораторна робота №6 — Варіант 2</title>

    <desc>
        Статичне зображення відповідно до варіанта 2.
        Малюнок складається з синіх кіл, еліпса та квадратів,
        розташованих відносно координатних осей X та Y.
    </desc>

    <!-- ОПИС ГРАФІЧНИХ ЕЛЕМЕНТІВ -->
    <defs>

        <!-- Коло для повторного використання -->
        <g id="blue-circle">
            <circle cx="0" cy="0" r="25"
                    fill="#0000ff"
                    stroke="#000000"
                    stroke-width="1.5"/>
        </g>

        <!-- Квадрат для повторного використання -->
        <g id="blue-square">
            <rect x="0" y="0"
                  width="50" height="50"
                  fill="#0000ff"
                  stroke="#000000"
                  stroke-width="1.5"/>
        </g>

        <!-- Символ кола -->
        <symbol id="blue-circle-symbol"
                viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="24"
                    fill="#0000ff"
                    stroke="#000000"
                    stroke-width="1.5"/>
        </symbol>

        <!-- Крива для розміщення тексту -->
        <path id="curve-text"
              d="M 150 545 Q 350 590 550 545"
              fill="none"/>

    </defs>

    <!-- БІЛИЙ ФОН -->
    <rect x="0" y="0"
          width="700" height="600"
          fill="#ffffff"/>

    <!-- СТАТИЧНИЙ МАЛЮНОК — ВАРІАНТ 2 -->
    <g id="variant-2-figure">

        <!-- Два верхні кола -->
        <use xlink:href="#blue-circle-symbol"
             x="200" y="200"
             width="50" height="50"/>

        <use xlink:href="#blue-circle-symbol"
             x="350" y="200"
             width="50" height="50"/>

        <!-- Лівий квадрат -->
        <use xlink:href="#blue-square"
             x="150" y="250"/>

        <!-- Правий квадрат -->
        <use xlink:href="#blue-square"
             x="400" y="250"/>

        <!-- Центральний еліпс -->
        <ellipse cx="300" cy="300"
                 rx="100" ry="50"
                 fill="#0000ff"
                 stroke="#000000"
                 stroke-width="1.5"/>

        <!-- Нижній видовжений еліпс -->
        <ellipse cx="300" cy="375"
                 rx="75" ry="25"
                 fill="#0000ff"
                 stroke="#000000"
                 stroke-width="1.5"/>

        <!-- Лівий нижній квадрат -->
        <use xlink:href="#blue-square"
                 x="200" y="400"/>

        <!-- Правий нижній квадрат -->
        <use xlink:href="#blue-square"
                 x="350" y="400"/>

    </g>

    <!-- КООРДИНАТНІ ОСІ -->
    <g id="coordinate-system"
       stroke="#000000"
       fill="#000000">

        <!-- Вісь X -->
        <line x1="50" y1="350"
              x2="510" y2="350"
              stroke-width="2.5"/>

        <!-- Стрілка осі X -->
        <polygon points="510,350 498,344 498,356"/>

        <!-- Вісь Y -->
        <line x1="150" y1="500"
              x2="150" y2="150"
              stroke-width="2.5"/>

        <!-- Стрілка осі Y -->
        <polygon points="150,150 144,162 156,162"/>

        <!-- Поділки осі X -->
        <g stroke-width="1.5">
            <line x1="200" y1="343" x2="200" y2="357"/>
            <line x1="250" y1="343" x2="250" y2="357"/>
            <line x1="300" y1="343" x2="300" y2="357"/>
            <line x1="350" y1="343" x2="350" y2="357"/>
            <line x1="400" y1="343" x2="400" y2="357"/>
        </g>

        <!-- Поділки осі Y -->
        <g stroke-width="1.5">
            <line x1="143" y1="300" x2="157" y2="300"/>
            <line x1="143" y1="250" x2="157" y2="250"/>
            <line x1="143" y1="200" x2="157" y2="200"/>
            <line x1="143" y1="400" x2="157" y2="400"/>
            <line x1="143" y1="450" x2="157" y2="450"/>
        </g>

        <!-- Числа на осі X -->
        <g font-family="Arial"
           font-size="17"
           text-anchor="middle">

            <text x="150" y="375">0</text>
            <text x="200" y="375">1</text>
            <text x="250" y="375">2</text>
            <text x="300" y="375">3</text>
            <text x="350" y="375">4</text>
            <text x="400" y="375">5</text>

        </g>

        <!-- Числа на осі Y -->
        <g font-family="Arial"
           font-size="17"
           text-anchor="end">

            <text x="137" y="306">1</text>
            <text x="137" y="256">2</text>
            <text x="137" y="206">3</text>
            <text x="137" y="406">-1</text>
            <text x="137" y="456">-2</text>

        </g>

        <!-- Позначення осей -->
        <text x="520" y="357"
              font-family="Arial"
              font-size="22">X</text>

        <text x="165" y="155"
              font-family="Arial"
              font-size="22">Y</text>

    </g>

    <!-- ТЕКСТ ПО КРИВІЙ -->
    <text font-family="Arial"
          font-size="18"
          font-weight="bold"
          fill="#0000ff">

        <textPath xlink:href="#curve-text"
                  startOffset="50%"
                  text-anchor="middle">

            ComputerZone — SVG Variant 2

        </textPath>

    </text>

</svg>